name: Keepalive Night Window

# Pauses the UptimeRobot /health monitor from 07:00 to 09:00 UTC (04:00-06:00
# in Uruguay) so Render can put the free backend to sleep, and resumes it after.
# Saves ~45 instance-hours in a 31-day month: without it SearchPet alone uses
# 744 of the workspace's 750, and on 2026-08-31 Render suspended the backend.
# The logic and the reasons live in .github/scripts/keepalive-window.sh.
#
# The main trigger is cron-job.org, not the schedule below: it calls this
# workflow's workflow_dispatch every 10 minutes (setup in DEPLOY.md). GitHub's
# cron is best-effort: on 2026-10-07 it dropped 11 of 14 hourly runs, and on
# 2026-10-08 it ran 3 of ~100 runs at every 10 minutes, so the 08:10 pause was
# never undone and the monitor stayed paused for 7 hours.
#
# The schedule stays as a backup. Both triggers are safe together because the
# script reconciles the monitor to the state the current hour calls for
# instead of toggling it, so any run fixes a missed one and extra runs change
# nothing.

on:
  schedule:
    - cron: '7-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive-window
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile monitor state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set the /health monitor for this hour
        env:
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          # UptimeRobot monitor that pings searchpet.onrender.com/health every
          # 5 minutes (CLAUDE.md rule #57).
          MONITOR_ID: '803088073'
          # Checks every 6 h that would hit the sleeping backend and open a
          # false "down" incident: /health/ready (803655471) and the two mail
          # quota alerts (803653159, 803653160). Paused with it, resumed after
          # the wake.
          QUIET_MONITOR_IDS: '803655471 803653159 803653160'
        run: bash .github/scripts/keepalive-window.sh
