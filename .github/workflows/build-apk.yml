name: Build APK

on:
  push:
    tags:
      - 'v*'
  # Manual runs build a test APK (artifact only, no release) from any branch.
  # A release is a deliberate `v*` tag; see "Releasing the app" in DEPLOY.md.
  workflow_dispatch:

# Google Sign-In OAuth 2.0 Web client id — the audience the backend verifies.
# Public by design (CLAUDE.md rule #25: GIS is a public client, there is no
# secret), and already committed in mobile/eas.json and the web bundle.
# Kept as a literal rather than a repository secret on purpose: an unset secret
# expands to an empty string, and an empty client id makes the Google button
# render nothing at all — an APK shipped without Google Sign-In and no error
# anywhere to show for it.
env:
  GOOGLE_WEB_CLIENT_ID: 436771110102-mo3o9c55flh5i8brebhfk5231ebbvo5g.apps.googleusercontent.com

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45  # prebuild + gradle assembleRelease; es el pipeline de release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history and tags: the release guard reads app.json at the
          # previous v* tag to check that versionCode grew.
          fetch-depth: 0

      # Fails in seconds instead of after the Gradle build when the tag and
      # app.json disagree, or when versionCode did not grow.
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/packages/mobile/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install dependencies
        working-directory: frontend/packages/mobile
        run: pnpm install --no-frozen-lockfile

      - name: Generate native Android project
        working-directory: frontend/packages/mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL }}
          EXPO_PUBLIC_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ env.GOOGLE_WEB_CLIENT_ID }}

      # expo prebuild genera un build.gradle que firma release con la debug key
      # publica del template de React Native (extraible por cualquiera). Se
      # inyecta la firma real: keystore desde secrets (base64) + signingConfig
      # que lee las credenciales de env en build time.
      - name: Configure release signing
        working-directory: frontend/packages/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: frontend/packages/mobile/android
        run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL }}
          EXPO_PUBLIC_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ env.GOOGLE_WEB_CLIENT_ID }}

      # Guard: el build falla si el APK quedo firmado con la debug key.
      # Evita volver a distribuir releases debug-signed sin darnos cuenta.
      - name: Verify release signature
        run: |
          APK=frontend/packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "Android Debug"; then
            echo "::error::APK is signed with the public debug key — release signing did not apply"
            exit 1
          fi

      - name: Rename APK
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          mv frontend/packages/mobile/android/app/build/outputs/apk/release/app-release.apk \
             "SearchPet-${SAFE_REF}.apk"
          # SearchPet.apk is the same file under a name that never changes, so
          # releases/latest/download/SearchPet.apk always downloads the newest
          # APK directly. The web download button links there: renaming or
          # dropping this asset breaks that button. Tags only: a manual run
          # uploads an artifact and creates no release.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            cp "SearchPet-${SAFE_REF}.apk" SearchPet.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SearchPet-APK
          path: SearchPet-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # SearchPet.apk comes from the Rename APK step; see the note there.
          files: |
            SearchPet-*.apk
            SearchPet.apk
          body: |
            ## SearchPet ${{ github.ref_name }}

            ### Instalar en Android
            1. Descargar SearchPet-${{ github.ref_name }}.apk
            2. Abrir el archivo en tu teléfono
            3. Si aparece advertencia, tocar "Instalar de todas formas"

            > **¿Ya tenías instalada la v1.0.5 o anterior?**
            > Desinstalá la app antes de instalar esta.
            >
            > Las versiones hasta la v1.0.5 salieron firmadas con la clave de
            > depuración pública de Android por un error del pipeline de build.
            > Desde la v1.0.6 se firman con la clave real del proyecto, y
            > Android no permite actualizar una app cuando cambia la firma: la
            > instalación falla con "aplicación no instalada" hasta que borres
            > la anterior. Es un único paso, y solo esta vez.

            ### iOS / Todos los dispositivos
            Instala la web app desde el navegador: agrega a tu pantalla de inicio.
          draft: false
          prerelease: false
