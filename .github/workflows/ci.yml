name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  # Sin filtro `branches`: corre en TODO pull request, apunte a donde apunte.
  # Con `branches: [main]`, un PR stackeado sobre otra rama no ejecutaba un solo
  # job y los unicos checks verdes eran los de Vercel, que solo dicen que el
  # preview deployo. Eso se lee como "suite verde" sin serlo.
  # Listar las ramas base a mano no sirve: hay que acordarse por cada stack, y
  # olvidarse falla en silencio. El deploy no corre riesgo — `deploy-backend`
  # exige `github.ref == 'refs/heads/main'`, y en un evento pull_request ese ref
  # es `refs/pull/<n>/merge`.
  pull_request:
  # Salida de emergencia de govulncheck (decision del usuario, 2026-09-27).
  # Por defecto un CVE alcanzable frena el deploy; en un hotfix urgente con un
  # CVE nuevo todavia sin arreglar, o con vuln.go.dev caido, se dispara este
  # workflow a mano SOBRE MAIN con skip_vulncheck=true: corre todo lo demas y
  # deploya. NO cubre una caida del proxy de modulos: `go mod download` corre
  # antes y tambien lo necesita. El salteo solo aplica en main (en otra rama
  # daria un verde sin deploy que se podria confundir con un build validado),
  # y exige un motivo, que queda escrito en el run.
  workflow_dispatch:
    inputs:
      skip_vulncheck:
        description: 'Saltear govulncheck (solo emergencias: hotfix con un CVE nuevo sin arreglar, o vuln.go.dev caido). Solo tiene efecto sobre main.'
        type: boolean
        default: false
      reason:
        description: 'Motivo del disparo manual (queda registrado en el run)'
        type: string
        required: true

# Permiso minimo del token para todos los jobs. Ninguno escribe en el repo: el
# deploy usa un hook de Render que sale de un secret, y las actions de cache y
# de artifacts usan el token propio del runner, no GITHUB_TOKEN. Un job que
# necesite mas lo declara el mismo, a nivel de job.
permissions:
  contents: read

jobs:
  # ============================================
  # Backend Tests (Go)
  # ============================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20  # observado 5m39s

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lostpets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: ./backend
        run: go mod download

      # UNICO lugar donde se decide si govulncheck se saltea: el paso de
      # govulncheck solo lee `steps.dispatch.outputs.skip`. Escribir la regla dos
      # veces (en el `if` del YAML y aca, para el log) dejaba que una cambiara
      # sin la otra y el registro volviera a mentir. Fuera de main el flag se
      # ignora. Si este paso no corre (no es un disparo manual), la salida queda
      # vacia y govulncheck corre.
      - name: Decidir salteo de govulncheck y registrar el disparo manual
        id: dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REASON: ${{ inputs.reason }}
          SKIP: ${{ inputs.skip_vulncheck }}
        run: |
          applied=false
          if [ "$SKIP" = "true" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then applied=true; fi
          echo "skip=$applied" >> "$GITHUB_OUTPUT"
          echo "workflow_dispatch en $GITHUB_REF por $GITHUB_ACTOR, skip_vulncheck=$SKIP (aplicado: $applied), motivo: $REASON"

      # go.mod/go.sum tienen que coincidir con los imports reales. Sin esto un
      # go.mod desfasado pasa inadvertido hasta que alguien corre `go mod tidy`
      # y aparece un cambio ajeno a su PR (paso con validator/v10 en el #269).
      - name: go mod tidy sin cambios
        working-directory: ./backend
        run: go mod tidy -diff

      # `-timeout 12m` explícito, y no el default de 10m, por el advisory lock
      # de `tests/testdb`: los paquetes se serializan contra la base, y el
      # timeout de Go se cuenta desde que arranca cada binario — la espera en la
      # cola INCLUIDA. O sea que el paquete que espera gasta su presupuesto
      # haciendo cola, aunque sus propios tests duren un segundo.
      #
      # 12m y NO 20m, y el techo del job de arriba es el motivo: con
      # `timeout-minutes: 20`, un `-timeout 20m` no puede dispararse nunca —
      # checkout, setup-go y `go mod download` ya comieron parte de esos 20
      # minutos antes de que este paso arranque. Si el candado alguna vez se
      # traba, GitHub mata el runner y perdemos el `panic: test timed out` con
      # su volcado de goroutines, que es exactamente el diagnóstico que hace
      # falta para entender por qué se trabó. El timeout de Go tiene que quedar
      # POR DEBAJO del techo del job para que llegue a hablar.
      #
      # Hoy sobra igual: con el candado puesto el paso tarda 210s medidos
      # (eran 162s sin candado, o sea que serializar cuesta ~48s).
      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lostpets_test?sslmode=disable
          JWT_SECRET: test-secret
        run: go test ./... -v -timeout 12m

      - name: Build
        working-directory: ./backend
        run: go build -o main ./cmd/server

      # Vulnerabilidades ALCANZABLES en dependencias y en la stdlib (S3 de la
      # auditoría 2026-09-23: CI compilaba con Go 1.25.0 exacto y nadie lo veía).
      # Va después de los tests para no esconder sus resultados, pero en este
      # job: Deploy Backend lo espera, así que un CVE alcanzable frena el deploy
      # hasta el bump. Es a propósito — la política es arreglar en el momento.
      # Versión fija, no @latest: es una herramienta de la cadena de suministro.
      - name: govulncheck
        if: ${{ steps.dispatch.outputs.skip != 'true' }}
        working-directory: ./backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  # ============================================
  # Backend E2E Tests (Go, contra Postgres real)
  # ============================================
  # Job PROPIO, y el motivo es un incidente concreto (2026-08-09): estos tests
  # vivian dentro de `e2e-web`, que hace `needs: [frontend-web]`. Un advisory
  # nuevo de npm puso el audit de web en rojo, `e2e-web` quedo SKIPPED, y los
  # e2e del backend no corrieron ni una vez durante todo un PR de backend. El
  # CI quedaba rojo —no era un falso verde— pero una verificacion se apagaba
  # sin que se notara, y la causa no tenia ninguna relacion con Go.
  #
  # Nada los ataba a la web: `startTestServer` levanta su propio httptest, asi
  # que no necesitan el binario en :8080 ni el preview de Vite. Solo Postgres.
  #
  # Ademas gana su propia base: en `e2e-web` compartian `lostpets_test` con el
  # backend que sirve a Playwright, y dos procesos escribiendo la misma base
  # durante una corrida es una fuente de intermitencias esperando su turno.
  #
  # Sin `if`: corre en todo push y todo PR, como backend-test. Estos tests son
  # la unica cobertura que toca Postgres de verdad (los mocks no tienen
  # columnas, ver regla #34) y son ~2 min en paralelo.
  e2e-backend:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15  # observado 1m17s

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lostpets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: ./backend
        run: go mod download

      # El build tag `e2e` es lo que los separa del resto: `go test ./...` a
      # secas NO los compila, asi que el verde de "Backend Tests" nunca dijo
      # nada sobre ellos.
      - name: Run Go e2e flow tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lostpets_test?sslmode=disable
          JWT_SECRET: test-secret-e2e
          BREVO_API_KEY: ""
          MAIL_FROM_EMAIL: ""
        run: go test -tags e2e -count=1 -v ./tests/e2e/...

  # ============================================
  # Backend Docker Image
  # ============================================
  # Render construye produccion con backend/Dockerfile y ningun otro job de este
  # workflow lo usa: los demas compilan con `go build` en el runner. Sin este job,
  # un Dockerfile roto aparecia recien como un deploy fallido en Render.
  backend-image:
    name: Backend Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fuente de verdad: el `adduser -u` de la etapa de runtime de
      # backend/Dockerfile. Si cambia ahi, cambia aca.
      APP_UID: "10001"

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lostpets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      # --pull: la etapa de runtime del Dockerfile fija una rama menor de Alpine
      # (no un patch) para que cada rebuild traiga los parches de seguridad; una
      # capa base cacheada no los traeria.
      - name: Build image
        run: docker build --pull -t searchpet-api:ci ./backend

      - name: Image runs as the non-root user
        run: |
          uid="$(docker run --rm --entrypoint id searchpet-api:ci -u)"
          echo "uid=$uid"
          test "$uid" = "$APP_UID"

      # --network host: el contenedor llega al Postgres del servicio por
      # localhost:5432, igual que el runner.
      - name: Start container
        run: |
          docker run -d --name api --network host \
            -e PORT=8080 \
            -e DATABASE_URL="postgres://postgres:postgres@localhost:5432/lostpets_test?sslmode=disable" \
            -e JWT_SECRET=test-secret-image \
            searchpet-api:ci

      # /health/ready corre SELECT 1: un 200 prueba que el binario arranco,
      # corrio las migraciones y llego a la base desde adentro de la imagen.
      # Plazo por reloj, no por cantidad de intentos: `--max-time` evita que un
      # request colgado (acepta la conexion y nunca responde) se coma el techo
      # de 15 min del job sin mostrar los logs. Si el contenedor muere
      # (migracion rota, env faltante) se corta ahi mismo. Cada salida deja su
      # propio `::error::`, y las dos terminan con los logs a la vista. El error
      # del ultimo intento de curl distingue un servidor colgado (timeout) de
      # uno que contesta 503 porque la base no responde.
      - name: Wait for readiness
        run: |
          timeout_s=90
          deadline=$((SECONDS + timeout_s))
          reason="no respondio /health/ready en ${timeout_s}s"
          last=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            if last=$(curl -sSf --max-time 5 http://localhost:8080/health/ready 2>&1); then
              echo "$last"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then
              reason="el contenedor termino antes de estar listo"
              break
            fi
            sleep 2
          done
          echo "::error::$reason (ultimo intento: ${last:-sin respuesta})"
          echo "=== CONTAINER LOGS ==="
          docker logs api
          exit 1

      - name: Server process runs as the non-root user
        run: |
          docker exec api grep '^Uid:' /proc/1/status
          docker exec api grep -qE "^Uid:[[:space:]]+${APP_UID}[[:space:]]" /proc/1/status

  # ============================================
  # Frontend Lint & Build (Web)
  # ============================================
  frontend-web:
    name: Frontend Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 15  # observado 1m26s

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/packages/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend/packages/web
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Security audit
        working-directory: ./frontend/packages/web
        run: pnpm audit --audit-level=high

      - name: Test
        working-directory: ./frontend/packages/web
        run: pnpm run test:run

      - name: Build
        working-directory: ./frontend/packages/web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: pnpm run build

  # ============================================
  # Mobile Tests (Jest + jest-expo)
  # ============================================
  mobile-test:
    name: Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15  # observado 39s
    defaults:
      run:
        working-directory: frontend/packages/mobile
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.3

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/packages/mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:run

  # ============================================
  # Mobile Security Audit
  # ============================================
  # Mobile no se auditaba: tenia 91 advisories (1 critico) sin que nada lo
  # dijera (S14 de la auditoria 2026-09-23). Los que tienen arreglo dentro del
  # rango van como overrides y los que no, como ignores con su motivo, los dos
  # en pnpm-workspace.yaml.
  #
  # Job PROPIO y fuera de los `needs` de deploy-backend, a proposito: el
  # resultado depende del registro de npm en el momento de correr, no solo del
  # PR. Un advisory alto o critico nuevo, o el endpoint de audit caido, lo
  # ponen en rojo en un PR que no toco dependencias. Adentro de `Mobile Tests`
  # eso se leia igual que un test roto, y como el deploy espera a ese job,
  # frenaba el backend por un paquete de mobile.
  mobile-audit:
    name: Mobile Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/packages/mobile
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.3

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Sin install: `pnpm audit` lee el lockfile y le pregunta al registro.
      - name: Security audit
        run: pnpm audit --audit-level=high

  # ============================================
  # E2E Tests (Web — Playwright contra el backend real)
  #
  # SOLO Playwright. Los e2e de Go se mudaron a `e2e-backend` para que dejen de
  # depender del build de web; aca quedan los que de verdad necesitan el
  # navegador, el preview de Vite y el binario sirviendo en :8080.
  #
  # El `if` de abajo dice pull_request O push a main — o sea, corre en todos los
  # PRs. El comentario anterior afirmaba "solo en push a main", que nunca fue lo
  # que hace la condicion.
  # ============================================
  e2e-web:
    name: E2E Tests (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 20  # observado 2m31s
    needs: [frontend-web]
    # workflow_dispatch sobre main tambien: deploy-backend espera a este job, y
    # si se saltea, GitHub saltea el deploy — la salida de emergencia de
    # govulncheck no deployaria nada.
    if: github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lostpets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lostpets_test?sslmode=disable
      JWT_SECRET: test-secret-e2e
      PORT: 8080
      REDIS_URL: ""
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      FIREBASE_KEY: ""
      BREVO_API_KEY: ""
      MAIL_FROM_EMAIL: ""
      RATE_LIMIT_AUTH_MAX: "100"

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: ./backend
        run: go build -o bin/server ./cmd/server

      - name: Start backend
        working-directory: ./backend
        run: ./bin/server > /tmp/backend.log 2>&1 &

      - name: Wait for backend
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:8080/api/stats; do sleep 2; done' || \
          (echo "=== BACKEND LOGS ===" && cat /tmp/backend.log && exit 1)

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/packages/web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: ./frontend/packages/web
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build web
        working-directory: ./frontend/packages/web
        env:
          VITE_API_URL: http://localhost:8080
        run: pnpm run build

      - name: Start web preview
        working-directory: ./frontend/packages/web
        run: pnpm run preview > /tmp/preview.log 2>&1 &

      # Espera EXPLICITA, igual que la del backend de mas arriba.
      #
      # Hasta ahora nadie esperaba a Vite: `playwright.config.ts` no tiene bloque
      # `webServer` (solo `baseURL`), asi que Playwright ni levanta ni espera el
      # servidor. Lo unico que le daba tiempo a bindear el 4173 era que la
      # instalacion de Chromium tardara uno o dos minutos — un `sleep` accidental
      # apoyado en la lentitud del paso siguiente.
      #
      # El cache que agrega este mismo commit hace ese paso casi instantaneo, o
      # sea que BORRA esa espera. Y el sintoma no aparece aca: los caches se
      # scopean por rama, asi que el primer hit ocurre despues de mergear y de
      # que corra `main`, en un PR que no va a tener nada que ver con este.
      # `retries: 1` lo taparia a veces, que es la peor forma de tenerlo.
      #
      # El log del preview va a un archivo, igual que el del backend: si no, la
      # salida de Vite muere con el proceso del paso anterior y esto falla
      # diciendo solo "no respondio". Y el caso mas probable no es un cuelgue
      # sino que el 4173 ya este tomado — `vite preview` NO usa strictPort por
      # defecto, asi que se corre en silencio al 4174 y la espera queda mirando
      # un puerto que nunca se va a abrir.
      - name: Wait for web preview
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:4173 >/dev/null; do sleep 1; done' || \
            (echo "::error::el preview de Vite no respondio en 4173 a los 60s" && \
             echo "=== PREVIEW LOGS ===" && cat /tmp/preview.log && exit 1)

      # Las DOS partes de la clave se resuelven aca adentro, y con guarda.
      #
      # La version sale del paquete INSTALADO y no de package.json: ahi dice
      # "^1.44.0", y una clave con un rango serviria binarios viejos despues de
      # que el lockfile suba de minor.
      #
      # `ImageOS` se lee como variable de PROCESO (`$ImageOS`) y nunca como
      # `${{ env.ImageOS }}`: el contexto `env` de las expresiones solo trae lo
      # declarado en el workflow/job/step o escrito a `$GITHUB_ENV`, jamas lo que
      # hereda el runner. Esto no es teoria — medido en la corrida 32178022533,
      # con la expresion la clave salio literalmente `playwright--1.60.0`: cadena
      # vacia en el medio, o sea que la guarda entre imagenes que el comentario
      # anterior prometia NO EXISTIA.
      #
      # Y el `echo "x=$(cmd)"` de antes tomaba el exit de `echo`, no el de
      # `node`, asi que un fallo dejaba el paso VERDE y la clave en
      # `playwright--`. Una clave constante restaura para siempre lo primero que
      # se haya cacheado y no se vuelve a guardar nunca. Por eso ahora se asigna
      # a variables y se valida que ninguna quede vacia.
      - name: Resolve cache key parts
        id: pw
        working-directory: ./frontend/packages/web
        run: |
          version=$(node -p "require('@playwright/test/package.json').version") || {
            echo "::error::no pude resolver la version de @playwright/test"; exit 1; }
          [ -n "$version" ] || { echo "::error::la version de Playwright salio vacia"; exit 1; }
          [ -n "$ImageOS" ] || { echo "::error::ImageOS vacio: la clave no distinguiria imagenes"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "imageos=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "clave de cache: playwright-$ImageOS-$version"

      # restore + save por SEPARADO, y no `actions/cache` a secas: su paso post
      # lleva `post-if: success()`, asi que con la suite E2E en rojo no guarda
      # nada. Justo el caso en el que se re-corre diez veces seguidas, cada una
      # pagando la descarga entera — el gasto que este cambio venia a sacar.
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.imageos }}-${{ steps.pw.outputs.version }}

      # `--with-deps` corre un apt-get, que es la parte que se colgo el
      # 2026-08-17 y el 2026-08-18. El comando NO cambia con el cache puesto:
      # `playwright install` detecta el browser ya bajado y lo saltea solo, asi
      # que no hace falta un `if` de cache-hit — una rama condicional aca seria
      # un camino mas que puede estar mal y que casi nunca se ejercita.
      - name: Install Playwright browsers
        id: pw-install
        working-directory: ./frontend/packages/web
        timeout-minutes: 10
        run: npx playwright install chromium --with-deps

      # Guarda aunque los TESTS fallen, pero solo si el install salio bien.
      # `if: always()` a secas cachearia un directorio a medio bajar cuando el
      # install se corta por su timeout de 10 minutos, y esa descarga parcial se
      # restauraria en cada corrida futura: convertiria un cuelgue de una sola
      # vez en un browser roto para siempre.
      - name: Save Playwright browsers
        if: steps.pw-install.outcome == 'success' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.imageos }}-${{ steps.pw.outputs.version }}

      - name: Run Playwright tests
        working-directory: ./frontend/packages/web
        run: pnpm run test:e2e
        env:
          API_URL: http://localhost:8080

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/packages/web/playwright-report/

  # ============================================
  # Deploy Backend (Render) — requiere RENDER_DEPLOY_HOOK_URL en GitHub Secrets
  # Obtenerlo en: Render Dashboard → tu servicio → Settings → Deploy Hook
  # ============================================
  # Este job es la UNICA via por la que el backend debe llegar a produccion.
  # El servicio de Render tiene que quedar con Auto-Deploy en OFF: si ademas
  # deploya solo por commit, cada merge a main buildea DOS veces (verificado en
  # ca21ad8: dos deploys, el segundo pisa al primero) y —peor— ese deploy por
  # commit no espera a los tests, asi que produccion corre codigo sin CI verde.
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10  # dispara un hook y sale
    # TODOS, no solo backend-test: un e2e o un build de web en rojo tienen que
    # frenar el deploy igual que un test de Go. Con `needs: [backend-test]` se
    # deployaba con el resto de la suite todavia corriendo, o directamente roja.
    #
    # `e2e-backend` esta en la lista por la misma razon, y ahora ademas hace
    # falta explicitamente: al salir de adentro de `e2e-web` dejo de estar
    # cubierto de rebote, asi que sin nombrarlo aca produccion podria recibir
    # codigo cuyos e2e nunca corrieron.
    #
    # `backend-image` valida el mismo Dockerfile con el que Render construye
    # produccion: si no construye o no arranca, no se deploya.
    needs: [backend-test, e2e-backend, backend-image, frontend-web, mobile-test, e2e-web]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Sin esto, un secret vacio o mal cargado hace que curl le pegue a la
          # cadena vacia y el job igual pase en verde: te quedas creyendo que
          # deployaste durante semanas.
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL no esta configurado — no se disparo ningun deploy"
            exit 1
          fi
          # --fail para que un 4xx/5xx del hook rompa el job. Sin el, curl sale 0
          # ante cualquier respuesta HTTP y este job reportaba 'success' aunque
          # Render no se hubiera enterado de nada.
          curl --fail --silent --show-error --location -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo ""
          echo "Deploy disparado. OJO: esto solo confirma que el hook acepto el request."
          echo "Que el build de Render termine bien se verifica en Render, no aca."

