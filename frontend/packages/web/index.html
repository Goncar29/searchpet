<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C24E1A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SearchPet" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SearchPet - Ayuda a encontrar mascotas perdidas. Publica, busca y comparte reportes de mascotas." />
    <!-- Open Graph: absolute image URL is required — crawlers do not resolve relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SearchPet" />
    <meta property="og:url" content="https://searchpet.vercel.app/" />
    <meta property="og:title" content="SearchPet - Encuentra mascotas perdidas" />
    <meta property="og:description" content="Plataforma gratuita para encontrar mascotas perdidas. Publica, busca en el mapa y comparte en redes sociales." />
    <meta property="og:image" content="https://searchpet.vercel.app/og/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SearchPet - Encuentra mascotas perdidas" />
    <meta name="twitter:description" content="Plataforma gratuita para encontrar mascotas perdidas." />
    <meta name="twitter:image" content="https://searchpet.vercel.app/og/og-cover.png" />
    <!-- The home hero photo is only shown from Tailwind's lg breakpoint up, and
         React draws it late, after the JS runs. Preloading it under the same
         media query lets a desktop start the download with the HTML, while a
         phone never fetches it. Keep the query in rem: it must match `lg:`
         exactly (CLAUDE.md rule #29). -->
    <link rel="preload" as="image" href="/hero.webp" type="image/webp" media="(min-width: 64rem)" fetchpriority="high" />
    <title>SearchPet - Encuentra mascotas perdidas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
