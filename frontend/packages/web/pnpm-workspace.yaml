allowBuilds:
  '@firebase/util': false
  core-js: false
  protobufjs: false

# Force the patched form-data across transitive paths (CRLF injection,
# GHSA-hmw2-7cc7-3qxx) — pulled in via @tensorflow/tfjs.
#
# Pin undici to 7.27.2: jsdom@29.1.1 requires undici (^7.25.0) and breaks
# on >=7.28.0 (it requires undici/lib/handler/wrap-handler.js, removed in
# 7.28). The two HIGH undici advisories live only in this dev-only
# vitest>jsdom test path (never shipped) and are ignored below via
# auditConfig. Without the pin, the lockfile drifts to 7.28 and the web
# test suite fails to start its jsdom workers.
# Force patched websocket-driver (>=0.7.5) across transitive paths. The
# <0.7.5 range has a critical message-corruption advisory
# (GHSA-xv26-6w52-cph6); it reaches us via firebase > @firebase/database >
# faye-websocket. websocket-driver is a Node server-side lib the web app
# never runs, but it still trips `pnpm audit --audit-level=high`.
#
# Force patched postcss (>=8.5.18) across transitive paths. Versions <=8.5.17
# auto-load previous source maps from a `sourceMappingURL`, allowing path
# traversal and arbitrary .map file disclosure (GHSA-r28c-9q8g-f849). It only
# reaches us through vite (build + test tooling), never as a direct dependency,
# so there is no top-level version to bump. vite@8 accepts postcss ^8.5.15,
# which the patched line satisfies.
overrides:
  form-data: '>=4.0.6'
  postcss: '>=8.5.18'
  undici: '>=7.29.0 <8'
  websocket-driver: '>=0.7.5'

# El override de undici estuvo clavado en 7.27.2 con el motivo de que la
# version parcheada era incompatible con jsdom@29.1.1. Ese motivo quedo
# VIEJO: se probo con jsdom 29.1.1 sin tocar, y undici 7.29.0 pasa la suite
# entera (48 archivos web + 12 de shared). Verificado el 2026-08-06.
#
# Subir el pin de 7.27.2 a >=7.29.0 <8 arregla CUATRO advisories high de una:
# los tres que estaban en ignoreGhsas (SOCKS5 ProxyAgent, WebSocket DoS,
# reuso del pool del proxy) mas GHSA-4cwx-7wf7-3272, publicado despues y que
# 7.27.2 no esquivaba. Total de vulnerabilidades: de 19 a 7.
#
# El tope <8 NO es prudencia: es el limite exacto, medido.
#
# jsdom-dispatcher.js hace require("undici/lib/handler/wrap-handler.js").
# Ese archivo existe en 7.27.2 y en 7.29.0, y NO existe en 8.10.0 — o sea que
# undici 8 rompe jsdom, y 7.29.0 no. Comprobado listando el directorio de cada
# version instalada, no deducido.
#
# Main afirmaba que jsdom "breaks on >=7.28.0" y que por eso el parche era
# inalcanzable, e ignoraba GHSA-4cwx-7wf7-3272 por ese motivo. La rotura esta
# en 8.x, no en 7.28+: el advisory SI se puede arreglar, y por eso el ignore se
# saca en vez de conservarse. Ojo que la suite pasa igual con undici 8 —los
# tests mockean la red y nunca llegan al dispatcher de jsdom—, asi que el verde
# no habria detectado la incompatibilidad.
#
# Also ignore the react-router RSC CSRF advisory. Its own text states: "This
# only affects your application if you are using the unstable RSC APIs." The
# web app is a declarative SPA — BrowserRouter + Routes/Route/Link/useNavigate,
# no data router, no loaders or actions, no framework mode, and no server at
# all (Vercel serves static files). The vulnerable code path is never loaded.
# The advisory has no fix in the 7.x line (patched >=8.3.0), so clearing it
# would mean a react-router major upgrade across ~40 files for a flaw we
# cannot reach. Revisit if the app ever adopts RSC or framework mode.
auditConfig:
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2 # react-router CSRF bypass in unstable RSC mode (unused)
