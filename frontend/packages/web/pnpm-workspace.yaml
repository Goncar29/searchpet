allowBuilds:
  '@firebase/util': false
  core-js: false
  protobufjs: false

# Force the patched form-data across transitive paths (CRLF injection,
# GHSA-hmw2-7cc7-3qxx) — pulled in via @tensorflow/tfjs.
#
# Force undici to >=7.29.1 <8. The upper bound is a measured limit, not
# caution: jsdom's dispatcher requires undici/lib/handler/wrap-handler.js,
# which exists throughout 7.x and was removed in 8.x. The long note below
# records how that was verified and why the old advisory ignores were dropped.
# Force patched websocket-driver (>=0.7.5) across transitive paths. The
# <0.7.5 range has a critical message-corruption advisory
# (GHSA-xv26-6w52-cph6); it reaches us via firebase > @firebase/database >
# faye-websocket. websocket-driver is a Node server-side lib the web app
# never runs, but it still trips `pnpm audit --audit-level=high`.
#
# Force patched postcss (>=8.5.18) across transitive paths. Versions <=8.5.17
# auto-load previous source maps from a `sourceMappingURL`, allowing path
# traversal and arbitrary .map file disclosure (GHSA-r28c-9q8g-f849). It only
# reaches us through vite (build + test tooling), never as a direct dependency,
# so there is no top-level version to bump. vite@8 accepts postcss ^8.5.15,
# which the patched line satisfies.
#
# Force patched nanoid (>=3.3.17) across transitive paths. customAlphabet and
# customRandom spin forever when called with size 0 (GHSA-2v37-7h3g-55p8), so an
# app passing an attacker-controlled size is exposed to a DoS. It reaches us only
# through vite > postcss, which calls nanoid with a fixed internal size and never
# runs in the browser, so the flaw is unreachable here — but it still trips
# `pnpm audit --audit-level=high`, which blocks every PR in the repo.
#
# The <4 bound is measured, not caution: nanoid >=4 is pure ESM (type: module
# with no `main`), while postcss is CommonJS and does require('nanoid'). Letting
# the override drift to 4.x or 5.x breaks the build. 3.3.18 still ships
# index.cjs, so the whole 3.x line stays safe to float within.
# Force patched source-map-js (>=1.2.2): GHSA-68fv-2mgg-jv7q, an event-loop
# denial of service when parsing a crafted source map. Four parents pull it,
# all build or test tooling: postcss (via vite), @tailwindcss/node (via
# @tailwindcss/vite), css-tree (via jsdom) and magicast (via
# @vitest/coverage-v8). All four declare ^1.2.1, so the patched line stays
# inside their ranges. Never runs in the browser, but it trips
# `pnpm audit --audit-level=high`, which blocks every PR.
#
overrides:
  dompurify: '>=3.4.13 <4'
  form-data: '>=4.0.6'
  nanoid: '>=3.3.17 <4'
  postcss: '>=8.5.18'
  protobufjs: '>=7.6.5 <8'
  source-map-js: '>=1.2.2 <2'
  undici: '>=7.29.1 <8'
  websocket-driver: '>=0.7.5'

# dompurify y protobufjs llegan transitivos (jspdf y firebase/firestore), asi
# que no hay version top-level que subir. Los dos se ARREGLAN en vez de
# ignorarse: el parche entra en el rango que ya pide su padre.
#
# dompurify: jspdf pide ^3.3.1. Los cinco advisories (GHSA-c2j3-45gr-mqc4,
# GHSA-cmwh-pvxp-8882, GHSA-vxr8-fq34-vvx9, GHSA-gvmj-g25r-r7wr,
# GHSA-55q2-fjhq-7xh7) llegan como mucho a 3.4.12. La app nunca llama a
# `.html()` de jsPDF, que es el unico camino que usa DOMPurify, pero arreglarlo
# cuesta menos que sostener cinco ignores. Tope <4: el rango de jspdf.
#
# protobufjs: @grpc/proto-loader pide ^7.5.5. GHSA-f38q-mgvj-vph7 se parcha en
# 7.6.3 y GHSA-j3f2-48v5-ccww en 7.6.5, asi que el piso es 7.6.5. La web no
# importa firestore, pero la dependencia esta en el arbol igual. Tope <8: la
# linea 8 tiene su propio parche y no entra en el rango de proto-loader.

# El override de undici estuvo clavado en 7.27.2 con el motivo de que la
# version parcheada era incompatible con jsdom@29.1.1. Ese motivo quedo
# VIEJO: se probo con jsdom 29.1.1 sin tocar, y undici 7.29.0 pasa la suite
# entera (48 archivos web + 12 de shared). Verificado el 2026-08-06.
#
# Subir el pin de 7.27.2 a >=7.29.0 <8 arregla CUATRO advisories high de una:
# los tres que estaban en ignoreGhsas (SOCKS5 ProxyAgent, WebSocket DoS,
# reuso del pool del proxy) mas GHSA-4cwx-7wf7-3272, publicado despues y que
# 7.27.2 no esquivaba. Total de vulnerabilidades: de 19 a 7.
#
# El tope <8 NO es prudencia: es el limite exacto, medido.
#
# jsdom-dispatcher.js hace require("undici/lib/handler/wrap-handler.js").
# Ese archivo existe en 7.27.2 y en 7.29.0, y NO existe en 8.10.0 — o sea que
# undici 8 rompe jsdom, y 7.29.0 no. Comprobado listando el directorio de cada
# version instalada, no deducido.
#
# Main afirmaba que jsdom "breaks on >=7.28.0" y que por eso el parche era
# inalcanzable, e ignoraba GHSA-4cwx-7wf7-3272 por ese motivo. La rotura esta
# en 8.x, no en 7.28+: el advisory SI se puede arreglar, y por eso el ignore se
# saca en vez de conservarse. Ojo que la suite pasa igual con undici 8 —los
# tests mockean la red y nunca llegan al dispatcher de jsdom—, asi que el verde
# no habria detectado la incompatibilidad.
#
# Piso subido a 7.29.1 el 2026-09-30: GHSA-w293-vg96-wgc3 (TLS bypass en
# BalancedPool) y GHSA-rfgv-xxqx-mfg5 (DoS por subprotocolo WebSocket no
# pedido) afectan <7.29.1 y rompian `pnpm audit` en todas las ramas. Solo
# llega via jsdom (tests), y el tope <8 sigue valiendo por el mismo motivo.
#
# Also ignore the react-router RSC CSRF advisory. Its own text states: "This
# only affects your application if you are using the unstable RSC APIs." The
# web app is a declarative SPA — BrowserRouter + Routes/Route/Link/useNavigate,
# no data router, no loaders or actions, no framework mode, and no server at
# all (Vercel serves static files). The vulnerable code path is never loaded.
# The advisory has no fix in the 7.x line (patched >=8.3.0), so clearing it
# would mean a react-router major upgrade across ~40 files for a flaw we
# cannot reach. Revisit if the app ever adopts RSC or framework mode.
#
# Also ignore GHSA-m9gg-hp2v-232j (@grpc/grpc-js, published 2026-09-30). The
# flaw is server-side only: with server credentials created with
# requireClientCertificate=false, getAuthContext reports unauthorized client
# certificates as authorized. The web app never creates a gRPC server, never
# calls getAuthContext, and never imports firestore (grpc-js arrives only as
# firebase > @firebase/firestore > @grpc/grpc-js; the browser build of
# firestore uses WebChannel, not grpc-js). The patch (1.13.6 / 1.14.5) is
# outside the ~1.9.0 range firestore pins, so an override would force four
# minors onto a package whose parent never asked for them. Revisit when
# firebase moves firestore to a patched grpc-js line.
auditConfig:
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2 # react-router CSRF bypass in unstable RSC mode (unused)
    - GHSA-m9gg-hp2v-232j # grpc-js server-side getAuthContext; web runs no gRPC server
